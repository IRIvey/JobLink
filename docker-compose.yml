version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5001
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    depends_on:
      - server
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G  # Increased from 512M to prevent white screen
        reservations:
          cpus: '0.5'
          memory: 512M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      # IMPORTANT: Use 'mongo' instead of 'localhost' in your connection string
      - MONGO_URI=mongodb://mongo:27017/your_database_name 
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G  # Increased to handle API requests without crashing
        reservations:
          cpus: '0.5'
          memory: 512M

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # This keeps your data safe between restarts
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G # MongoDB is memory-hungry; 512M was likely killing it
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  mongo-data: # Declaring the named volume for persistence